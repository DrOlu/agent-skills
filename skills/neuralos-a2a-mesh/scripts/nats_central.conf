# nats_central.conf — central cloud NATS server for a neuralOS A2A mesh.
# Validate before use:  nats-server -t -c nats_central.conf
# Params from references/parameters.md section A.  Replace every REPLACE_* value.

server_name: hub-01
listen: 0.0.0.0:4222
http: 0.0.0.0:8222                    # monitoring (doctor + jsz/varz checks)

# ---- TLS (REQUIRED in production) ----
tls {
  cert_file: "/etc/nats/tls/server.crt"
  key_file:  "/etc/nats/tls/server.key"
  ca_file:   "/etc/nats/tls/ca.crt"
  timeout:   5
}

# ---- JetStream (durable mailbox + tasks) ----
jetstream {
  store_dir: "/var/lib/nats/jetstream"     # PERSISTENT path — never /tmp
  max_mem: 1G
  max_file: 20G
}

# ---- WebSocket (browser / home agents, optional) ----
websocket {
  port: 8443
  no_tls: false                            # uses the tls {} block above
}

# ---- Leaf-node acceptor (sites with no direct WAN route) ----
leafnodes {
  listen: "0.0.0.0:7422"
  authorization { timeout: 2 }
}

system_account: SYS

accounts {
  SYS: { users: [ { user: sys, password: "REPLACE_SYS_PASSWORD" } ] }

  # One account per organisation/tenant. JetStream ON for agent accounts.
  ORG_A: {
    jetstream: enabled
    users: [
      # One NKey user per agent — public key from `nats nkeys genuser`.
      { nkey: "REPLACE_AGENT_A1_PUBLIC_KEY",
        permissions: {
          publish:   { allow: ["mesh.agent.>", "mesh.registry.register",
                               "mesh.registry.discover", "mesh.heartbeat.>",
                               "mesh.task.>", "mesh.event.>",
                               "_INBOX.>", "_inbox.>", "_R_.>", "_REPLY.>",
                               "$JS.>", "$JS.API.>", "$kv.>", "$KV.>"] }
          subscribe: { allow: ["mesh.registry.discover", "mesh.registry.get.>",
                               "mesh.event.reputation.>",
                               "_INBOX.>", "_inbox.>", "$JS.>", "$KV.>"] }
        } }
    ]
  }

  ORG_B: { jetstream: enabled, users: [ { nkey: "REPLACE_AGENT_B1_PUBLIC_KEY" } ] }

  # Leaf/remote account: no JetStream (isolation gotcha #1).
  REMOTE: {}
}

