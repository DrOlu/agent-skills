# ---- Operational notes ----
# * Reload accounts/permissions without dropping connections:  kill -HUP $(pgrep -f nats-server)
# * Confirm acceptance:  curl -s localhost:8222/varz | jq '{version,jetstream}'
#                        curl -s localhost:8222/jsz  | jq '.api.errors'   # -> 0
# * Secrets: NKey seeds stay on the agents (mode 600); only public keys live here.
# * Data residency: put store_dir on storage in the jurisdiction that applies.