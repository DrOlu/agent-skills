# nats_edge.conf — edge / client-side NATS for a neuralOS A2A mesh.
# Two shapes: (A) direct client, (B) site-local server + leaf-node remote.
# Validate:  nats-server -t -c nats_edge.conf

# ============================================================
# (A) DIRECT CLIENT (most edges)
#   No local nats-server — the gateway connects straight to the hub.
#   Configuration is entirely on the client side:
#     NATS_URL=tls://REPLACE_HUB_HOST:4222
#     NATS_CREDS=/etc/reactorpro/<edge>.creds   # or NATS_NKEY=/etc/reactorpro/<edge>.seed
#   Nothing to install locally. The gateway dials OUT only.
# ============================================================

# ============================================================
# (B) SITE-LOCAL SERVER + LEAF NODE (no direct WAN route from every host)
# ============================================================
server_name: site-REPLACE_SITE
listen: 0.0.0.0:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: "/var/lib/nats/jetstream"      # site-local durability; PERSISTENT path
  max_mem: 512M
  max_file: 5G
}

# Edges at the site connect here (plain, LAN-only):
#   NATS_URL=nats://<site-local-host>:4222
# Only THIS host crosses the WAN, via the leaf-node remote below.
leafnodes {
  remotes = [
    {
      url: "tls://REPLACE_HUB_HOST:7422"
      creds: "/etc/nats/site-REPLACE_SITE.creds"
      account: "REMOTE"
      # Do not move mesh state across the leaf — keep it at the hub:
      deny_exports: [ "mesh.registry.>", "mesh.agent.>", "mesh.heartbeat.>", "mesh.task.>" ]
      deny_imports: [ "mesh.registry.>", "mesh.agent.>", "mesh.heartbeat.>", "mesh.task.>" ]
    }
  ]
}

# ---- Verify the leaf ----
#   curl -s http://127.0.0.1:8222/leafz | jq '.leafs[] | {name,is_spoke,account}'
#   curl -s http://127.0.0.1:8222/jsz   | jq '.api.errors'      # -> 0
#
# ---- Boot persistence ----
#   systemd unit:  Restart=always ;  launchd: KeepAlive=true ;  Windows: NSSM/service